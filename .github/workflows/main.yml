name: Build Android APK

# التشغيل يدوي من تبويب Actions (زر Run workflow) — أو تلقائيًا عند دفع وسم
# إصدار (مثل v1.0.0) فيُنشأ GitHub Release مع الملف مرفقًا.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # منظم تلقائي: أي ملف .dart مرفوع بالخطأ على جذر المستودع (بدل مجلده
      # داخل lib/) يُنقل هنا إلى مجلده الصحيح ويُحفظ التعديل في المستودع.
      - name: Auto-organize stray .dart files from repo root
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          shopt -s nullglob
          moved=0
          for f in *.dart; do
            case "$f" in
              *_game.dart)              dest="lib/games" ;;
              *_screen.dart)            dest="lib/screens" ;;
              *_service.dart)           dest="lib/services" ;;
              worlds.dart)              dest="lib/data" ;;
              app_strings.dart)         dest="lib/l10n" ;;
              app.dart)                 dest="lib" ;;
              celebration_overlay.dart) dest="lib/widgets" ;;
              *)                        dest="" ;;
            esac
            if [ -n "$dest" ]; then
              mkdir -p "$dest"
              mv -f "$f" "$dest/"
              echo "Moved $f -> $dest/"
              moved=1
            else
              rm -f "$f"
              echo "Deleted unknown stray file: $f"
            fi
          done
          if [ "$moved" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-organize misplaced dart files into lib/"
            git push
          fi

      # Flutter 3.27.4 يستخدم Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # المستودع لا يتضمن مجلد android/ — يُولَّد هنا من القوالب الرسمية
      # (flutter create لا يمس الكود ولا الأصول ولا الاختبارات الموجودة)
      - name: Generate Android platform files
        run: flutter create . --platforms android --org com.littleexplorers

      - name: Configure app (Arabic name, minSdk 24, compileSdk 36, Kotlin 2.1.0)
        run: |
          # اسم التطبيق على شاشة الجهاز
          sed -i 's/android:label="[^"]*"/android:label="عالم المستكشفين الصغار"/' \
            android/app/src/main/AndroidManifest.xml
          # ★ minSdk 24 — تطلبه النسخ الحديثة من إضافة النطق flutter_tts
          # ★ compileSdk 36 — تطلبه الإضافة نفسها (التوافق تنازلي: يعمل على أندرويد 7 فما فوق)
          # يغطي نمطي Groovy وKotlin DSL
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          fi
          # ★ رفع Kotlin Gradle plugin إلى 2.1.0 — يطلبه flutter_tts مع محرك Flutter 3.27
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle || true
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.1.0"/' android/settings.gradle || true
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.1.0"/' android/settings.gradle.kts || true
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.1.0"/' android/build.gradle || true
          fi
          # اختبار القالب الافتراضي يشير لفئة MyApp غير الموجودة — يُحذف (اختباراتنا الحقيقية تبقى)
          rm -f test/widget_test.dart

      # التطبيق مصمم ببدائل مرسومة (Glyphs) فلا يتعطل غياب الصور/الأصوات.
      # هذه الخطوة تضمن أن البناء ينجح حتى لو لم تُرفع مجلدات assets بعد،
      # وبمجرد رفع الأصول الحقيقية لاحقًا يستخدمها البناء تلقائيًا بلا تعديل.
      - name: Prepare assets (build works with or without media files)
        run: |
          # 1) أنشئ أي مجلد أصول مُعلَن في pubspec وغير موجود على المستودع
          for d in assets/images/bg assets/images/chars assets/images/objects \
                   assets/audio/en assets/audio/sfx assets/audio/music; do
            mkdir -p "$d"
            # ملف فارغ حتى لا يبقى المجلد خاليًا تمامًا (يُستبدل تلقائيًا عند رفع الأصول الحقيقية)
            [ -n "$(ls -A "$d" 2>/dev/null)" ] || touch "$d/.gitkeep"
          done
          # 2) أيقونة مؤقتة من قالب Flutter حتى تُرفع الأيقونة الحقيقية
          if [ ! -f assets/icon.png ] && [ -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png assets/icon.png
            echo "Temporary app icon copied from Flutter template."
          fi
          # 3) إن لم تُرفع ملفات الخط بعد، أزل قسم fonts من pubspec حتى لا يفشل البناء
          if [ ! -f assets/fonts/BalooBhaijaan2-400.ttf ]; then
            sed -i '/^  fonts:/,$d' pubspec.yaml
            echo "Font files not found in repo -> fonts section removed for this build."
          fi

      - name: Install dependencies
        run: flutter pub get

      # يكشف أخطاء الكود مبكرًا برسائل واضحة (الأخطاء فقط — لا يمنع التحذيرات)
      - name: Static analysis (errors only)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # الاختبارات تظهر نتيجتها في السجل لكنها لا تعطّل البناء
      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LittleExplorers-1.0.0.apk
          ls -lh dist/

      # الناتج يظهر أسفل صفحة التشغلة في قسم Artifacts (ملف مضغوط بداخله الـ APK)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleExplorers-APK
          path: dist/LittleExplorers-1.0.0.apk
          retention-days: 30

      # فقط عند دفع وسم مثل: git tag v1.0.0 && git push origin v1.0.0
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LittleExplorers-1.0.0.apk \
            --title "إصدار $GITHUB_REF_NAME — عالم المستكشفين الصغار" \
            --generate-notes
